name: Build and Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  
jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package, test tools, and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[serial,coap,eltakotool]'
          python -m pip install pytest build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Check package version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import importlib.metadata as m, os; expected = os.environ["RELEASE_TAG"].removeprefix("v"); actual = m.version("eltako14bus"); assert actual == expected, f"{actual=} != {expected=}"'

      - name: Compile sources
        run: python -m compileall -q eltakobus tests eltakotool.py

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import eltakobus; print('eltakobus import succeeded')"

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          username: __token__
          password: ${{ secrets.PYPI_TOKEN }} 
